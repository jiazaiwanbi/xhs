name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs:
      - backend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: api
            package: ./cmd
          - binary: worker
            package: ./cmd/worker
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build ${{ matrix.binary }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/${{ matrix.binary }}-linux-amd64 ${{ matrix.package }}

      - name: Upload ${{ matrix.binary }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-linux-amd64
          path: dist/${{ matrix.binary }}-linux-amd64
          if-no-files-found: error

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend-api
            file: backend/Dockerfile
            target: api
          - image: backend-worker
            file: backend/Dockerfile
            target: worker
          - image: frontend
            file: frontend/Dockerfile
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} with target
        if: ${{ matrix.target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ${{ matrix.image }}
        if: ${{ matrix.target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
